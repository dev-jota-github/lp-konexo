     ============================================================ -->
<!-- PLACEHOLDER: depoimentos fictícios; trocar por reais antes de publicar -->
<section class="section section--alt depo" id="depoimentos" data-placeholder="true">
  <div class="container">
    <p class="eyebrow">Depoimentos</p>
    <h2 data-split>Quem trabalha com a Konexo, <em class="serif">recomenda</em>.</h2>
  </div>
  <div>
    <div class="depo__track" id="depoTrack" tabindex="0" aria-label="Depoimentos de clientes">
      <!-- Depoimentos will be rendered by JS from data/depoimentos.json -->
    </div>
    <div class="container depo__ctrl">
      <p class="depo__hint"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 12h13m0 0-4-4m4 4-4 4M3 12h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Arraste para ler mais</p>
      <div class="depo__btns">
        <button class="depo__btn" type="button" data-dir="-1" aria-label="Depoimento anterior"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12H7m0 0 4-4m-4 4 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="depo__btn" type="button" data-dir="1" aria-label="Próximo depoimento"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h13m0 0-4-4m4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </div>
</section>
