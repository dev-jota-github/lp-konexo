<!-- ============================================================
     CASES SECTION
     ============================================================ -->
<!-- PLACEHOLDER: cases fictícios; trocar por reais antes de publicar -->
<section class="section section--alt" id="cases" data-placeholder="true">
  <div class="glow glow--volt" style="width:460px;height:460px;top:6%;left:-12%;opacity:.07"></div>
  <div class="container">
    <p class="eyebrow">Resultados</p>
    <h2 data-split>Números que <em class="serif">conversam</em> com o caixa.</h2>
    <div class="cases__list" id="casesList">
      <!-- Cases will be rendered by JS from data/cases.json -->
    </div>
    <div class="cases__foot">
      <p id="casesCtaText">Seu case pode ser o próximo.</p>
      <a href="#diagnostico" class="btn btn--volt" data-magnetic data-cursor="Vamos" id="casesCtaBtn">Quero meu diagnóstico gratuito
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m0 0-6-6m6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </div>
  <!-- Preview flutuante dos cases (desktop) -->
  <div class="case-preview" id="casePreview" aria-hidden="true">
    <div class="case-preview__slide cp-1"><div class="art"></div><p>Aura</p></div>
    <div class="case-preview__slide cp-2"><div class="art"></div><p>Forno & Fogo</p></div>
    <div class="case-preview__slide cp-3"><div class="art"></div><p>Vértice</p></div>
    <div class="case-preview__slide cp-4"><div class="art"></div><p>Casa Lume</p></div>
  </div>
</section>
